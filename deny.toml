# Licence policy: GPL-3.0-or-later project; only GPL-3-compatible dependency licences.
[graph]
# Check the feature set we actually build. (all-features would enable optional backends we never
# use, e.g. rfd's GTK backend, and report their dependencies.)
all-features = false
# Only the platforms we build for: prunes target-specific dependencies that are never compiled
# (e.g. muda is macOS-only in atomik-app, so its Linux GTK backend is not part of any build).
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "GPL-3.0-or-later", "GPL-3.0-only", "0BSD",
  "LGPL-2.1-or-later", "LGPL-3.0-or-later", "CC0-1.0", "Unlicense", "BSL-1.0",
  # The root certificates the update check trusts (webpki-roots): permissive, data only.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "hashbrown@0.16.1", reason = "gpu-allocator (under wgpu, under vello) is one minor behind indexmap and fontique" },
  { crate = "miniz_oxide@0.8.9", reason = "png 0.18 uses it next to flate2's newer one; both come with png" },
]
skip-tree = [
  { crate = "winit@0.30", reason = "winit 0.30 pins the objc2 0.5 family, core-graphics 0.23, bitflags 1 and an older rustix; waits for the vello and winit upgrade (docs/DEPENDENCIES.md)" },
  { crate = "midir@0.11", reason = "midir still depends on jni 0.21 and coremidi's older core-foundation; track midir releases (docs/DEPENDENCIES.md)" },
  { crate = "rfd@0.17", reason = "rfd 0.17 pulls pollster 0.4 next to ours (docs/DEPENDENCIES.md)" },
]

[advisories]
yanked = "deny"
ignore = [
  # ttf-parser is unmaintained (no safe upgrade). It reaches us only via winit -> sctk-adwaita
  # (Wayland client-side decorations on Linux). Not a vulnerability. Revisit on winit updates.
  # Every ignore carries a review date: scripts/check-advisory-ignores.sh (run by the Security
  # workflow) fails once it has passed, so look at the advisory again and renew it deliberately.
  { id = "RUSTSEC-2026-0192", reason = "transitive via winit/sctk-adwaita; unmaintained notice only, no upgrade available; review-by 2027-02-01" },
  { id = "RUSTSEC-2024-0436", reason = "paste, a proc-macro used at build time by nokhwa (the Windows and macOS camera backends of atomik-vision); unmaintained notice only, no vulnerability; review-by 2027-02-01" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
