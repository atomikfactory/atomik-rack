# cargo-nextest settings. CI runs `cargo nextest run --profile ci`; locally `cargo test` works as
# ever and `cargo nextest run` (the default profile) is optional. See docs/TESTING.md.
#
# nextest runs every test in a process of its own and schedules the tests of all the test programs
# together, where `cargo test` runs one program after the other. A test that relied on sharing a
# process with another test would fail here: none does (the ones that serialise through a lock in
# their file, or count a process-wide figure, only needed it because the tests of a program shared
# one process).

[profile.ci]
# Every failure of the run is shown, as `--no-fail-fast` does.
fail-fast = false
# No retries: a test that fails now and then is a defect to fix, not to hide.
retries = 0
# As many tests at once as the runner has cores.
test-threads = "num-cpus"
# A test running longer than the period is marked SLOW in the log; none is ever terminated by this
# setting, the test's own bounds decide.
slow-timeout = { period = "60s" }
status-level = "slow"
final-status-level = "slow"
failure-output = "immediate-final"

# The tests that start and kill real plugin child processes, or read the process table, run one at
# a time, as the locks inside their files used to make them (those locks cannot reach across the
# processes nextest uses), and not next to the tests of other programs: they wait on children
# that a loaded runner starts slowly.
[test-groups]
process-lifecycle = { max-threads = 1 }

[[profile.ci.overrides]]
filter = '''
    binary_id(atomik-plugin-hostd::e2e_kill)
  | binary_id(atomik-plugin-hostd::e2e_watch)
  | binary_id(atomik-plugin-hostd::orphan)
  | binary_id(atomik-plugin-hostd::sweep)
  | binary_id(atomik-app::kill_recovery)
'''
test-group = "process-lifecycle"
