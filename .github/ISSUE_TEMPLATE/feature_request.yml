name: Feature request
description: Suggest a new feature or an improvement
title: "feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the behaviour you want in your own words. Please do not attach material copied
        from other products (screenshots, presets, samples, manual excerpts).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What the feature should do from a user's point of view (inputs, outputs, ranges, workflow).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: os
    attributes:
      label: Operating system (if it matters)
      options:
        - Not specific to one OS
        - Windows
        - macOS
        - Linux
  - type: dropdown
    id: audio-host
    attributes:
      label: Audio host (if it matters)
      options:
        - Not applicable
        - WASAPI
        - ASIO
        - CoreAudio
        - ALSA
        - JACK
  - type: input
    id: version
    attributes:
      label: Atomik Rack version or commit you are using
  - type: textarea
    id: invariants
    attributes:
      label: Fit with the hard invariants
      description: Does this touch the real-time render path (HI-1), determinism (HI-2) or the graph rules (HI-3)?
