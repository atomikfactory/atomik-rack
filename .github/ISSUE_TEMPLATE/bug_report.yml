name: Bug report
description: Something does not work as documented
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems must **not** be reported here: use the private
        advisory form linked from the issue chooser (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Numbered steps. Attach a minimal patch or project file or a failing test if you can.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Atomik Rack version or commit
      description: A release version, or the output of `git rev-parse HEAD`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
  - type: dropdown
    id: audio-host
    attributes:
      label: Audio host
      description: The audio API in use, if the bug involves live audio.
      options:
        - Not applicable (offline render, UI, files)
        - WASAPI
        - ASIO
        - CoreAudio
        - ALSA
        - JACK
        - Other
  - type: input
    id: plugin
    attributes:
      label: Plugin (if the bug involves one)
      description: Plugin name, format (CLAP or VST3) and version.
  - type: input
    id: toolchain
    attributes:
      label: Rust toolchain (if you built it yourself)
      placeholder: output of `rustc --version`
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: text
