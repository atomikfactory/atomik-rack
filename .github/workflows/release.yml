name: Release

# On a tag vX.Y.Z (which must equal the Cargo.toml version) builds the release artifacts through the
# reusable build workflow (build.yml): Windows zip and installer, macOS zip and dmg, Linux tar.gz
# and deb, each with a .sha256, plus SHA256SUMS (and SHA256SUMS.asc when a GPG key is configured).
# Every artifact is smoke-tested, and signed where the signing secrets exist (see
# docs/RELEASING.md); then a DRAFT GitHub release is created with all of them, and a maintainer
# publishes it by hand after checking it. A manual run builds and smoke-tests but never creates a
# release. The optional ASIO backend (which needs a Steinberg SDK that is not part of this
# repository) is never built here.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the version (tag must match Cargo.toml)
        id: v
        run: echo "version=$(sh scripts/release/version.sh)" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 14

  draft-release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: atomik-rack-*
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          WINDOWS_SIGNED: ${{ needs.build.outputs.windows-signed }}
          MACOS_SIGNED: ${{ needs.build.outputs.macos-signed }}
          MACOS_NOTARIZED: ${{ needs.build.outputs.macos-notarized }}
          CHECKSUMS_SIGNED: ${{ needs.build.outputs.checksums-signed }}
        run: |
          set -eu
          cd dist
          sha256sum -c SHA256SUMS
          ls -l
          cd ..
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if [ "$WINDOWS_SIGNED" = "true" ]; then win="Authenticode-signed"; else win="not signed"; fi
          if [ "$MACOS_NOTARIZED" = "true" ]; then
            mac="Developer ID signed and notarised"
          elif [ "$MACOS_SIGNED" = "true" ]; then
            mac="Developer ID signed, not notarised"
          else
            mac="ad-hoc signed only"
          fi
          if [ "$CHECKSUMS_SIGNED" = "true" ]; then sums="SHA256SUMS.asc is its GPG signature"; else sums="SHA256SUMS is not signed"; fi
          notes="Release notes: see CHANGELOG.md. Signing: Windows $win, macOS $mac, $sums. A build that is not signed makes the system warn on first launch; see the README for the first-run steps. Verify the downloads against SHA256SUMS."
          set -- dist/atomik-rack[-_]* dist/SHA256SUMS
          if [ -f dist/SHA256SUMS.asc ]; then set -- "$@" dist/SHA256SUMS.asc; fi
          gh release create "$TAG" "$@" --repo "$REPO" --draft --verify-tag $prerelease \
            --title "Atomik Rack $TAG" --notes "$notes"
