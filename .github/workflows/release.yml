name: Release

# Builds release binaries for Windows, macOS and Linux. Pushing a tag vX.Y.Z also creates a
# DRAFT GitHub release with the archives and checksums attached; a maintainer publishes it by
# hand after checking it. A manual run only produces workflow artifacts. The optional ASIO
# backend (which needs a Steinberg SDK that is not part of this repository) is never built here.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release
      - name: Build
        run: cargo build --release --locked -p atomik-app -p atomik-render -p atomik-play -p atomik-plugin-scan
      - name: Package
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -eu
          version="$REF_NAME"
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) version="dev-$(git rev-parse --short HEAD)" ;;
          esac
          os="$(echo "$RUNNER_OS_NAME" | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          name="atomik-rack-$version-$os-$arch"
          mkdir -p "dist/$name"
          ext=""
          if [ "$RUNNER_OS_NAME" = "Windows" ]; then ext=".exe"; fi
          for bin in atomik atomik-render atomik-play atomik-plugin-scan; do
            cp "target/release/$bin$ext" "dist/$name/"
          done
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS_NAME" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atomik-rack-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  draft-release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          ls -l dist
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" --draft --verify-tag $prerelease \
            --title "Atomik Rack $TAG" \
            --notes "Release notes: see CHANGELOG.md. Verify the downloads against the .sha256 files."
