name: Coverage

# Line coverage with cargo-llvm-cov: the workspace gate of 90 percent and a floor per crate
# (scripts/coverage-floors.sh, scripts/coverage-floors.txt). It is the slowest job of the
# project, so a pull request does not run it by default: it runs on every push to main, once a
# night, by hand, and on a pull request that carries the `coverage` label (Dependabot pull
# requests do not carry it). The per-crate table is in the job summary; lcov.info is an artifact.
#
# One job over the whole workspace needed more than its time limit (the build is about a quarter
# of an hour and the tests over an hour), so the tests run in shards, in parallel jobs
# (scripts/coverage-shards.txt: every workspace package is in exactly one shard, the last shard
# is every package nobody lists). Each shard writes the lcov report of its own run, and the
# `report` job merges them (scripts/merge-lcov.py) and applies the same gate and floors as ever.
on:
  push:
    branches: [main]
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Excluded from the gate: binary entry points and GPU/audio-device glue that cannot run on
  # CI runners (no GPU, no audio devices). Their logic is tested through pure cores. The CLAP
  # and VST3 test plugin libraries only run inside the scanner child and the plugin host as
  # loaded libraries, which the instrumented test binaries do not measure (their DSP core,
  # testplugins/core, is measured). The patterns are anchored on the crate path.
  IGNORE_FILENAME_REGEX: '(^|/)crates/([^/]+/src/main[.]rs|ui/src/scene_canvas[.]rs|ui/src/text[.]rs|audio-io/src/stream[.]rs|play/src/backend[.]rs|testplugins/(clap|vst3)[^/]*/src/[^/]*[.]rs|vision/src/(bin/vision-demo|camera/system)[.]rs)$'
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  plan:
    name: coverage plan
    # The scheduled run belongs to this repository only. A pull request runs it when it has the
    # `coverage` label (adding the label starts it, later pushes rerun it).
    if: >-
      (github.event_name != 'pull_request' && (github.event_name != 'schedule' || github.repository == 'atomikfactory/atomik-rack'))
      || contains(github.event.pull_request.labels.*.name, 'coverage')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The shards
        id: matrix
        run: |
          python3 scripts/coverage-shards.py --self-test
          python3 scripts/merge-lcov.py --self-test
          echo "shards=$(python3 scripts/coverage-shards.py matrix)" >> "$GITHUB_OUTPUT"

  shard:
    name: coverage (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # A shard that fails its tests does not stop the others: the run shows every failure at once.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          cache-key: coverage-${{ matrix.shard }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov
      # Fails when a workspace package is in no shard or in two (it cannot be the first when the
      # shards are the job matrix, which is made before any toolchain is installed).
      - name: Every package is in exactly one shard
        run: python3 scripts/coverage-shards.py check
      # The cache restores instrumented test programs of earlier builds, and the report reads every
      # program it finds, so stale ones would add lines that no longer exist and count them
      # uncovered. The clean keeps the dependencies and drops the workspace's own programs and
      # profiles.
      - name: Drop the instrumented programs and profiles of earlier builds
        run: cargo llvm-cov clean --workspace
      # Some tests start the plugin host or the plugin scanner program that sits beside the test
      # programs, and those are built only with the tests of their own packages. This builds them
      # in every shard and runs no test (the filter matches none).
      - name: Build the child programs the tests start
        run: >-
          cargo llvm-cov --no-report -p atomik-plugin-hostd -p atomik-plugin-scan
          -- no_test_has_this_name
      - name: Run the tests of the shard with coverage
        run: >-
          cargo llvm-cov --no-report --no-fail-fast
          $(python3 scripts/coverage-shards.py args '${{ matrix.shard }}')
      - name: Drop profile files a killed child left empty
        # A sandboxed plugin child that is killed on purpose by a test can leave an empty profile
        # file, and the merge then stops with "no profile can be merged".
        run: |
          if [ -d target/llvm-cov-target ]; then
            find target/llvm-cov-target -name '*.profraw' -size 0 -print -delete
          fi
      # The report of this shard only: its profiles and its test programs. The gate is applied to
      # the merge of all of them in the `report` job.
      - name: Report of the shard
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex "$IGNORE_FILENAME_REGEX"
          --lcov --output-path 'lcov-${{ matrix.shard }}.info'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-${{ matrix.shard }}
          path: lcov-${{ matrix.shard }}.info
          if-no-files-found: error
          retention-days: 3

  report:
    name: coverage (llvm-cov)
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lcov-*
          path: shards
          merge-multiple: true
      - name: Merge the reports and apply the workspace gate
        run: >-
          python3 scripts/merge-lcov.py --fail-under-lines 90 --output lcov.info shards/*.info
      - name: Coverage floor of each crate
        run: sh scripts/coverage-floors.sh lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
