name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sandbox_only:
        description: >-
          Run only the plugin sandbox end to end job (Linux and macOS) and the cheap checks:
          the build, clippy and test jobs skip their steps.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # Which files the change touches, and so which packages to build and test: on a pull request
  # only the packages that own a changed file, those that depend on them, and those whose tests
  # read a changed document or data file (`scripts/ci/affected.py`). A change outside the crates
  # (manifests, lock file, CI, scripts) tests everything. A change to documents no test reads skips
  # the build and test jobs. The hygiene job, which checks the documents against the code, always
  # runs. Any doubt (a push, a manual run, an API failure) means the whole workspace.
  changes:
    name: changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.plan.outputs.code }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look at the changed files
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SANDBOX_ONLY: ${{ inputs.sandbox_only }}
        run: |
          set -u
          code=true
          packages="--workspace"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SANDBOX_ONLY" = "true" ]; then
            code=false
            echo "::notice title=Sandbox only::only the plugin sandbox job runs"
          fi
          if [ "$EVENT" = "pull_request" ] \
            && files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')" \
            && [ -n "$files" ] \
            && plan="$(printf '%s\n' "$files" | python3 scripts/ci/affected.py)"; then
            case "$plan" in
              all) ;;
              none)
                code=false
                echo "::notice title=Documents only::the build and test jobs are skipped"
                ;;
              *)
                packages="$plan"
                echo "::notice title=Affected packages::$plan"
                ;;
            esac
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: clippy
      - name: cargo clippy
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        # shellcheck disable=SC2086
        run: cargo clippy $PACKAGES --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.profile }})
    needs: changes
    runs-on: ${{ matrix.os }}
    # The release leg compiles the whole workspace optimised with debug info: on Windows that
    # alone took 46 to 89 minutes (the cache holds the dependencies, not the workspace crates), so
    # 90 cancelled green runs. The tests themselves take about 15 minutes.
    timeout-minutes: ${{ matrix.profile == 'release' && 150 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [debug]
        include:
          # Release builds on Linux and Windows: catch optimisation-dependent behaviour (HI-2); the
          # Windows leg also runs the exact-hash goldens with the release profile.
          - os: ubuntu-latest
            profile: release
          - os: windows-latest
            profile: release
    env:
      # A documents-only change skips the steps below, not the job: a matrix job that is skipped
      # as a whole never reports the names a required check waits for. The release legs take 45
      # to 70 minutes, so a pull request runs the debug legs only (on its affected packages); the
      # release legs run on main after the merge and on a manual run.
      RUN_CODE: >-
        ${{ (matrix.profile == 'release' && github.event_name == 'pull_request')
            && 'false' || needs.changes.outputs.code }}
      # `--workspace`, or the affected packages as `-p name ...` on a pull request.
      PACKAGES: ${{ needs.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        if: env.RUN_CODE == 'true'
        with:
          cache-key: test-${{ matrix.profile }}
      # The test plugins are libraries of the workspace: build them once here, next to the tests'
      # own dependencies, and tell the tests so (no nested `cargo build` under a lock in each
      # test binary). Without the variable the tests build what they need themselves.
      - name: Build the test plugins
        if: env.RUN_CODE == 'true'
        shell: bash
        run: |
          set -eu
          packages=""
          for manifest in crates/testplugins/*/Cargo.toml; do
            name="$(sed -n 's/^name = "\(.*\)"/\1/p' "$manifest" | head -n 1)"
            packages="$packages -p $name"
          done
          flags=""
          if [ "${{ matrix.profile }}" = "release" ]; then flags="--release"; fi
          # shellcheck disable=SC2086
          cargo build $flags $packages
          echo "ATOMIK_TEST_PLUGINS_PREBUILT=1" >> "$GITHUB_ENV"
      - name: cargo test (debug)
        if: env.RUN_CODE == 'true' && matrix.profile == 'debug'
        shell: bash
        # shellcheck disable=SC2086
        run: cargo test $PACKAGES --no-fail-fast
      - name: cargo test (release)
        if: env.RUN_CODE == 'true' && matrix.profile == 'release'
        shell: bash
        # shellcheck disable=SC2086
        run: cargo test $PACKAGES --release --no-fail-fast
      # A pixel golden that fails leaves the actual, golden and diff images here.
      - name: Upload the pixel diff images
        if: failure() && env.RUN_CODE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-diff-${{ matrix.os }}-${{ matrix.profile }}
          path: target/pixel-diff/
          if-no-files-found: ignore

  # The plugin sandbox with a real child process on the two platforms where its wake-up calls and
  # the redirection of the child's stdout are not Windows code: the doorbell, the shared block,
  # the life cycle, a crash, a hang and a kill, each against the real `atomik-plugin-host`, and
  # every in-repo test plugin library (CLAP and VST3: the main ones, the crash, hang, leak, bad
  # and variants ones) loaded through the sandbox, with a gesture from the plugin's editor. The
  # test matrix runs these tests too; this job names them, so a failure here says what it is.
  sandbox:
    name: sandbox end to end (${{ matrix.os }})
    needs: changes
    # When the plugin process code or a test plugin is affected (or on a full run), and on every
    # manual run.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (needs.changes.outputs.code == 'true'
          && (needs.changes.outputs.packages == '--workspace'
              || contains(needs.changes.outputs.packages, 'atomik-plugin-')
              || contains(needs.changes.outputs.packages, 'atomik-test-')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: sandbox
      # The test plugin libraries first, as the test job does: the tests then only locate them.
      - name: Build the test plugins
        shell: bash
        run: |
          set -eu
          packages=""
          for manifest in crates/testplugins/*/Cargo.toml; do
            name="$(sed -n 's/^name = "\(.*\)"/\1/p' "$manifest" | head -n 1)"
            packages="$packages -p $name"
          done
          # shellcheck disable=SC2086
          cargo build $packages
          echo "ATOMIK_TEST_PLUGINS_PREBUILT=1" >> "$GITHUB_ENV"
      - run: >-
          cargo test -p atomik-plugin-ipc -p atomik-plugin-sandbox -p atomik-plugin-hostd
          -p atomik-plugin-host --no-fail-fast

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  hygiene:
    name: public-repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/check-public.sh
      # The manual release protocol: unique ids and the report script that reads them.
      - run: |
          sh scripts/release/test-report-test.sh
          sh scripts/release/test-report.sh --check
      # The Linux packages (AppImage, Flatpak, deb): the scripts' syntax and dry runs, the manifest,
      # the desktop entry and the metainfo. Nothing is built or downloaded: the packages are built
      # by the release and nightly workflows only.
      - name: Linux packaging files
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends shellcheck desktop-file-utils appstream
          shellcheck scripts/release/package-appimage.sh scripts/release/package-flatpak.sh \
            scripts/release/linux-share.sh scripts/release/linux-metainfo.sh \
            scripts/release/appimage-libs.sh scripts/release/fetch-appimagetool.sh \
            scripts/release/package-appimage-test.sh scripts/release/package-flatpak-test.sh \
            scripts/release/appimage-libs-test.sh
          sh scripts/release/appimage-libs-test.sh
          sh scripts/release/package-appimage-test.sh
          sh scripts/release/package-flatpak-test.sh
          desktop-file-validate packaging/linux/io.github.atomikfactory.AtomikRack.desktop
          RELEASE_DATE=2026-01-01 sh scripts/release/linux-metainfo.sh v0.4.0 "$RUNNER_TEMP/io.github.atomikfactory.AtomikRack.metainfo.xml"
          appstreamcli validate --no-net "$RUNNER_TEMP/io.github.atomikfactory.AtomikRack.metainfo.xml"
      # The documents: the long guides are hard-wrapped, every Markdown link and anchor resolves,
      # the crate table of ARCHITECTURE.md matches the Cargo.toml files and the functions the
      # guides cite exist.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: hygiene
      - run: cargo test -p atomik-testkit --test docs_hygiene --test docs_match_code --test guard_inventory
