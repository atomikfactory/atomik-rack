name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # Which files the change touches: a change to documents only (Markdown and docs/) skips the
  # build and test jobs. The hygiene job, which checks the documents against the code, always
  # runs. Any doubt (a push, a manual run, an API failure) means the code jobs run.
  changes:
    name: changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.plan.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look at the changed files
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -u
          code=true
          if [ "$EVENT" = "pull_request" ] \
            && files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')" \
            && [ -n "$files" ]; then
            code=false
            # A document counts as code when a test of the crates names it (the architecture
            # guide's command count, the devices guide): such a change runs everything.
            for file in $files; do
              case "$file" in
                docs/* | *.md)
                  if grep -rqF --include='*.rs' "$(basename "$file")" crates; then code=true; fi
                  ;;
                *) code=true ;;
              esac
            done
            if [ "$code" = "false" ]; then
              echo "::notice title=Documents only::the build and test jobs are skipped"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.profile }})
    needs: changes
    runs-on: ${{ matrix.os }}
    # The release leg compiles the whole workspace optimised with debug info; it needs longer.
    timeout-minutes: ${{ matrix.profile == 'release' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [debug]
        include:
          # Release builds on Linux and Windows: catch optimisation-dependent behaviour (HI-2); the
          # Windows leg also runs the exact-hash goldens with the release profile.
          - os: ubuntu-latest
            profile: release
          - os: windows-latest
            profile: release
    env:
      # A documents-only change skips the steps below, not the job: a matrix job that is skipped
      # as a whole never reports the names a required check waits for.
      RUN_CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        if: env.RUN_CODE == 'true'
        with:
          cache-key: test-${{ matrix.profile }}
      # The test plugins are libraries of the workspace: build them once here, next to the tests'
      # own dependencies, and tell the tests so (no nested `cargo build` under a lock in each
      # test binary). Without the variable the tests build what they need themselves.
      - name: Build the test plugins
        if: env.RUN_CODE == 'true'
        shell: bash
        run: |
          set -eu
          packages=""
          for manifest in crates/testplugins/*/Cargo.toml; do
            name="$(sed -n 's/^name = "\(.*\)"/\1/p' "$manifest" | head -n 1)"
            packages="$packages -p $name"
          done
          flags=""
          if [ "${{ matrix.profile }}" = "release" ]; then flags="--release"; fi
          # shellcheck disable=SC2086
          cargo build $flags $packages
          echo "ATOMIK_TEST_PLUGINS_PREBUILT=1" >> "$GITHUB_ENV"
      - name: cargo test (debug)
        if: env.RUN_CODE == 'true' && matrix.profile == 'debug'
        run: cargo test --workspace --no-fail-fast
      - name: cargo test (release)
        if: env.RUN_CODE == 'true' && matrix.profile == 'release'
        run: cargo test --workspace --release --no-fail-fast
      # A pixel golden that fails leaves the actual, golden and diff images here.
      - name: Upload the pixel diff images
        if: failure() && env.RUN_CODE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-diff-${{ matrix.os }}-${{ matrix.profile }}
          path: target/pixel-diff/
          if-no-files-found: ignore

  # The plugin sandbox with a real child process on the two platforms where its wake-up calls and
  # the redirection of the child's stdout are not Windows code: the doorbell, the shared block,
  # the life cycle, a crash, a hang and a kill, each against the real `atomik-plugin-host`. The
  # test matrix runs these tests too; this job names them, so a failure here says what it is.
  sandbox:
    name: sandbox end to end (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: sandbox
      - run: cargo test -p atomik-plugin-ipc -p atomik-plugin-sandbox -p atomik-plugin-hostd --no-fail-fast

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  hygiene:
    name: public-repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/check-public.sh
      # The manual release protocol: unique ids and the report script that reads them.
      - run: |
          sh scripts/release/test-report-test.sh
          sh scripts/release/test-report.sh --check
      # The documents: the long guides are hard-wrapped, every Markdown link and anchor resolves,
      # the crate table of ARCHITECTURE.md matches the Cargo.toml files and the functions the
      # guides cite exist.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: hygiene
      - run: cargo test -p atomik-testkit --test docs_hygiene --test docs_match_code --test guard_inventory
