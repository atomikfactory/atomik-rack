[package]
name = "atomik-plugin-clap"
description = "Atomik Rack CLAP plugin host backend over clack-host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
atomik-core.workspace = true
atomik-device-sdk.workspace = true
atomik-plugin-host.workspace = true
clap-sys = "0.5.0"
clack-host = "=0.2.0"
clack-extensions = { version = "=0.2.0", features = ["clack-host", "params", "note-ports", "audio-ports", "latency", "tail", "state", "gui", "thread-check", "timer", "log", "render", "remote-controls"] }

[dev-dependencies]
atomik-engine.workspace = true
atomik-test-plugin-core.workspace = true
atomik-testkit.workspace = true
libloading = "0.9.0"

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
float_cmp = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
undocumented_unsafe_blocks = "deny"
