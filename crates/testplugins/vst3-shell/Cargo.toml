[package]
name = "atomik-test-vst3-shell"
description = "Atomik Rack test plugins: a minimal VST3 plugin shell over the vst3 crate that the VST3 test plugin libraries share (not shipped)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
atomik-test-plugin-core.workspace = true
vst3 = "=0.3.0"

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
float_cmp = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
undocumented_unsafe_blocks = "deny"
