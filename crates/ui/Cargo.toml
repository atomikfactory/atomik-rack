[package]
name = "atomik-ui"
description = "Atomik Rack UI toolkit: view tree, widgets, procedural rack panels, cables, vello rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
atomik-audio-file.workspace = true
atomik-library.workspace = true
atomik-core.workspace = true
atomik-device-sdk.workspace = true
atomik-model.workspace = true
vello.workspace = true
parley.workspace = true
# Optional CPU rasteriser (feature `cpu-canvas`): PNG previews, snapshots and MCP screenshots.
vello_cpu = { workspace = true, optional = true }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
atomik-devices.workspace = true
atomik-plugin-host.workspace = true
atomik-dsp.workspace = true
# This crate's own tests use the CPU canvas (tests/support/cpu.rs).
atomik-ui = { path = ".", features = ["cpu-canvas"] }
proptest.workspace = true

[features]
# `cpu_canvas::CpuCanvas`: a `vello_cpu` Canvas for PNG previews, snapshots and screenshots.
cpu-canvas = ["dep:vello_cpu"]
# The `KeyScript` test driver (keymap::script), for the key-script tests of other crates.
testkit = []

[lints]
workspace = true
