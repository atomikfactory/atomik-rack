[package]
name = "atomik-plugin-hostd"
description = "Atomik Rack plugin sandbox child: hosts one plugin instance in its own process (bin atomik-plugin-host)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "atomik_plugin_hostd"
path = "src/lib.rs"

[[bin]]
name = "atomik-plugin-host"
path = "src/main.rs"

[dependencies]
atomik-core.workspace = true
atomik-device-sdk.workspace = true
atomik-plugin-host.workspace = true
atomik-plugin-ipc.workspace = true
atomik-plugin-clap.workspace = true
atomik-plugin-vst3.workspace = true
winit.workspace = true
thread-priority.workspace = true

[dev-dependencies]
atomik-plugin-sandbox.workspace = true
atomik-engine.workspace = true
atomik-testkit.workspace = true
atomik-test-plugin-core.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
